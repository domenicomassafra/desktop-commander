name: Owner hosting CI
on:
  push:
    branches: [main]
    paths: ['hosting/**', '.github/workflows/owner-*.yml']
  pull_request:
    paths: ['hosting/**', '.github/workflows/owner-*.yml']
permissions:
  contents: read
jobs:
  hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: python3 -m unittest discover -s hosting -p 'test_*.py' -v
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: sh hosting/build.sh
      - run: node test/test-feature-flags-timeout.js
        env:
          DESKTOP_COMMANDER_DISABLE_TELEMETRY: '1'
          DC_FLAG_URL: 'data:application/json,{"flags":{}}'
